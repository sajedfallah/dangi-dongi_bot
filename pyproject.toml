[project]
name = "tikino-telegram-bot"
version = "0.1.0"
description = "Commercial event ticketing Telegram bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "SQLAlchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "redis>=5,<6",
  "python-dotenv>=1,<2",
  "aiohttp>=3.10,<4",
  "qrcode[pil]>=7.4,<9",
  "cryptography>=43,<46",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
