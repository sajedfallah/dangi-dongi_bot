services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dongi
      POSTGRES_USER: dongi
      POSTGRES_PASSWORD: dongi
    volumes:
      - dongi_pg:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://dongi:dongi@db:5432/dongi
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  dongi_pg:
