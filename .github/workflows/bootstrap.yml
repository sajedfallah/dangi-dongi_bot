name: Bootstrap repository

on:
  workflow_dispatch:
  push:
    paths:
      - 'bootstrap/tikino-source.tar.gz.b64'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and extract source
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/tikino-source.tar.gz.b64
          base64 --decode bootstrap/tikino-source.tar.gz.b64 > /tmp/tikino-source.tar.gz
          tar -tzf /tmp/tikino-source.tar.gz >/dev/null
          tar -xzf /tmp/tikino-source.tar.gz -C .
          rm -rf bootstrap
      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import stabilized Tikino v0.1.0 baseline'
          git push origin HEAD:main
